name: Update README stats

on:
  schedule:
    - cron: "17 16 * * *" # 00:17 Singapore time, daily
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stats block
        env:
          # STATS_TOKEN is optional: add it to include private-repo activity (see setup notes)
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: Hypovolemic
        run: python scripts/update_stats.py

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        # On a failed fetch the step fails without writing, so the last good card is kept
        # and the stats commit below still runs
        continue-on-error: true
        with:
          card: top-langs
          options: username=Hypovolemic&layout=compact&theme=github_dark&hide_border=true&hide=html&size_weight=0.5&count_weight=0.5
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit if changed
        run: |
          # Stage first so the card is picked up on the run that creates it (untracked files are invisible to git diff)
          git add README.md profile/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update README stats"
          git push